[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hearthside"
description = "The chat terminal for hobkin: multi-line input that's yours, output above it, a status bar. Install it beside hobkin and `hobkin chat` uses it."
dynamic = ["version"]   # from hearthside.__version__
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Lynam" }]
requires-python = ">=3.9"
dependencies = ["prompt_toolkit>=3.0.36,<4", "pygments>=2.10"]
keywords = ["hobkin", "agent", "chat", "terminal", "tui", "prompt_toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/frank-lynam/hearthside"
Issues = "https://github.com/frank-lynam/hearthside/issues"

[tool.flit.sdist]
include = ["tests/"]
exclude = ["CLAUDE.md", "AGENTS.md"]
